<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Painel de Apps - Rodopar Command Center</title>
  <link rel="icon" type="image/png" href="https://static.wixstatic.com/media/9ebff8_5d10d8c7991649848ad5bcc5dc1664cf~mv2.png">
  <link rel="shortcut icon" type="image/png" href="https://static.wixstatic.com/media/9ebff8_5d10d8c7991649848ad5bcc5dc1664cf~mv2.png">
  <style>
    /* ---- TEMA SCI-FI / CYBERPUNK FUTURISTIC RODOPAR COMMAND CENTER ---- */
    :root {
      --verde-cana: #7cdb14;
      --verde-bright: #a2f83c;
      --verde-cana-escuro: #386903;
      --verde-glow: rgba(124, 219, 20, 0.65);
      --verde-glow-strong: rgba(162, 248, 60, 0.95);
      --cyan-bright: #00f0ff;
      --cyan-glow: rgba(0, 240, 255, 0.5);
      --bg-color: #030603;
      
      /* Variáveis Dinâmicas de Dimensionamento - FONTE REDUZIDA */
      --hud-bar-height: 46px;
      --btn-font-size: clamp(0.55rem, 0.8vw, 0.7rem); 
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      background-image:
        radial-gradient(circle at 50% 50%, rgba(45, 120, 15, 0.28) 0%, rgba(8, 16, 8, 0.94) 50%, #020402 85%),
        linear-gradient(rgba(124, 219, 20, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124, 219, 20, 0.04) 1px, transparent 1px);
      background-size: 100% 100%, 35px 35px, 35px 35px;
      color: #fff;
      overflow: hidden;
    }

    /* ---- ELEMENTOS DE FUNDO (LASERS & WINGS) ---- */
    .bg-elements { position: absolute; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; transition: opacity 0.5s ease; }
    
    .bg-corner { 
      position: absolute; 
      width: clamp(280px, 30vw, 520px); 
      height: clamp(180px, 20vw, 360px); 
      opacity: 0.9; 
      filter: drop-shadow(0 0 15px rgba(124, 219, 20, 0.4)) drop-shadow(0 0 5px rgba(162, 248, 60, 0.6));
    }
    .bg-corner svg { width: 100%; height: 100%; }
    .bg-corner.tl { top: 0; left: 0; }
    .bg-corner.tr { top: 0; right: 0; transform: scaleX(-1); }
    .bg-corner.bl { bottom: 0; left: 0; transform: scaleY(-1); }
    .bg-corner.br { bottom: 0; right: 0; transform: scale(-1, -1); }

    .bg-center-top, .bg-center-bottom { 
      position: absolute; left: 50%; transform: translateX(-50%); width: clamp(320px, 50vw, 750px); height: clamp(45px, 6vw, 90px); 
      filter: drop-shadow(0 0 10px rgba(124, 219, 20, 0.5));
    }
    .bg-center-top svg, .bg-center-bottom svg { width: 100%; height: 100%; }
    .bg-center-top { top: 0; }
    .bg-center-bottom { bottom: 0; transform: translateX(-50%) scaleY(-1); }

    .laser-horizon-top, .laser-horizon-bottom { 
      position: absolute; left: 0; width: 100%; height: 2px; 
      background: linear-gradient(90deg, transparent 0%, var(--verde-cana) 20%, #fff 50%, var(--verde-cana) 80%, transparent 100%); 
      box-shadow: 0 0 15px var(--verde-cana), 0 0 30px var(--verde-glow), 0 0 5px #fff; 
      z-index: 2; animation: pulsarLaser 3s infinite alternate; 
    }
    .laser-horizon-top { top: clamp(45px, 6.5vw, 82px); }
    .laser-horizon-bottom { bottom: clamp(45px, 6.5vw, 82px); }

    @keyframes pulsarLaser { 0% { opacity: 0.6; filter: brightness(0.8); } 100% { opacity: 1; filter: brightness(1.2); } }

    /* ---- TELA INICIAL (NOVA VERSÃO TECNOLÓGICA) ---- */
    #tela-inicial { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; padding: 20px; transition: opacity 0.5s ease; }
    
    /* Scanlines isolados apenas na tela inicial */
    #tela-inicial::after {
      content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%); background-size: 100% 4px; z-index: 9999; pointer-events: none; opacity: 0.6;
    }

    .cyber-frame-wrapper { 
      position: relative; width: min(560px, 90vw); height: clamp(180px, 30vh, 260px); cursor: pointer; filter: drop-shadow(0 0 40px rgba(124, 219, 20, 0.3)); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    }
    .cyber-frame-wrapper:hover, .cyber-frame-wrapper:active { 
      transform: scale(1.05); filter: drop-shadow(0 0 60px rgba(162, 248, 60, 0.6)) drop-shadow(0 0 20px rgba(162, 248, 60, 0.8)); 
    }

    .cyber-frame-border { 
      position: absolute; inset: 0; background: linear-gradient(135deg, #a4f840 0%, #204003 25%, var(--verde-cana) 50%, #204003 75%, #a4f840 100%); background-size: 200% 200%; animation: borderFlow 4s linear infinite;
      clip-path: polygon(35px 0, calc(50% - 45px) 0, calc(50% - 30px) 14px, calc(50% + 30px) 14px, calc(50% + 45px) 0, calc(100% - 35px) 0, 100% 35px, 100% calc(100% - 35px), calc(100% - 35px) 100%, calc(50% + 45px) 100%, calc(50% + 30px) calc(100% - 14px), calc(50% - 30px) calc(100% - 14px), calc(50% - 45px) 100%, 35px 100%, 0 calc(100% - 35px), 0 35px); 
    }
    @keyframes borderFlow { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }

    .cyber-frame-middle { 
      position: absolute; inset: 4px; background: #020402; 
      clip-path: polygon(33px 0, calc(50% - 43px) 0, calc(50% - 28px) 13px, calc(50% + 28px) 13px, calc(50% + 43px) 0, calc(100% - 33px) 0, 100% 33px, 100% calc(100% - 33px), calc(100% - 33px) 100%, calc(50% + 43px) 100%, calc(50% + 28px) calc(100% - 13px), calc(50% - 28px) calc(100% - 13px), calc(50% - 43px) 100%, 33px 100%, 0 calc(100% - 33px), 0 33px); 
    }

    .cyber-frame-inner { 
      position: absolute; inset: 8px; 
      background: radial-gradient(ellipse at 50% 50%, rgba(35, 71, 25, 0.4) 0%, rgba(5, 11, 5, 0.9) 65%, #000 100%), linear-gradient(rgba(124, 219, 20, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(124, 219, 20, 0.1) 1px, transparent 1px); background-size: 100% 100%, 15px 15px, 15px 15px;
      clip-path: polygon(30px 0, calc(50% - 40px) 0, calc(50% - 26px) 12px, calc(50% + 26px) 12px, calc(50% + 40px) 0, calc(100% - 30px) 0, 100% 30px, 100% calc(100% - 30px), calc(100% - 30px) 100%, calc(50% + 40px) 100%, calc(50% + 26px) calc(100% - 12px), calc(50% - 26px) calc(100% - 12px), calc(50% - 40px) 100%, 30px 100%, 0 calc(100% - 30px), 0 30px); 
      display: flex; justify-content: center; align-items: center; box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.9), inset 0 0 30px rgba(124, 219, 20, 0.3); padding: 15px; 
    }

    .cyber-frame-inner::before, .cyber-frame-inner::after {
      content: ""; position: absolute; width: 85%; height: 75%; border: 1px solid rgba(124, 219, 20, 0.2); pointer-events: none;
    }
    .cyber-frame-inner::before { clip-path: polygon(0 0, 15px 0, 15px 2px, 2px 2px, 2px 15px, 0 15px, 0 calc(100% - 15px), 2px calc(100% - 15px), 2px calc(100% - 2px), 15px calc(100% - 2px), 15px 100%, 0 100%); left: 10px; }
    .cyber-frame-inner::after { clip-path: polygon(100% 0, calc(100% - 15px) 0, calc(100% - 15px) 2px, calc(100% - 2px) 2px, calc(100% - 2px) 15px, 100% 15px, 100% calc(100% - 15px), calc(100% - 2px) calc(100% - 15px), calc(100% - 2px) calc(100% - 2px), calc(100% - 15px) calc(100% - 2px), calc(100% - 15px) 100%, 100% 100%); right: 10px; }

    .led-slot { position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%); width: 80px; height: 6px; background: #000; border-radius: 4px; border: 1px solid #1a2c16; display: flex; align-items: center; justify-content: center; z-index: 5; box-shadow: 0 0 10px rgba(124, 219, 20, 0.5); }
    .led-light { width: 50px; height: 2px; background: #ffffff; box-shadow: 0 0 10px #ffffff, 0 0 20px var(--verde-cana), 0 0 40px var(--verde-cana); border-radius: 2px; }
    
    .cyber-frame-inner img { width: clamp(200px, 60%, 320px); max-height: 80%; object-fit: contain; filter: drop-shadow(0 0 15px rgba(124, 219, 20, 0.4)); transition: filter 0.3s; }
    .cyber-frame-wrapper:hover .cyber-frame-inner img { filter: drop-shadow(0 0 25px rgba(124, 219, 20, 0.8)); }

    .instrucao-wrapper { display: flex; align-items: center; gap: 15px; margin-top: clamp(35px, 6vh, 55px); z-index: 10; }
    .bracket { color: var(--verde-cana); font-size: 1.5rem; font-weight: 300; opacity: 0.7; text-shadow: 0 0 10px var(--verde-glow); animation: bracketPulse 2s infinite alternate; }
    .instrucao { color: var(--verde-cana); font-weight: 800; font-size: clamp(0.8rem, 2vw, 1rem); letter-spacing: 4px; text-transform: uppercase; text-align: center; text-shadow: 0 0 15px var(--verde-glow); }
    @keyframes bracketPulse { 0% { opacity: 0.3; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1.1); text-shadow: 0 0 20px var(--verde-bright); } }

    /* ---- TELA DO PAINEL COMMAND CENTER ---- */
    #tela-painel { display: none; position: relative; z-index: 10; width: 100vw; height: 100vh; height: 100dvh; flex-direction: column; align-items: center; justify-content: space-between; animation: fadeIn 0.6s ease; padding: 10px clamp(10px, 2vw, 25px); overflow: hidden; }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }

    .hud-top-bar { width: 100%; max-width: 1800px; min-height: var(--hud-bar-height); display: flex; justify-content: space-between; align-items: center; background: linear-gradient(90deg, rgba(8,16,8,0.95) 0%, rgba(18,36,16,0.98) 50%, rgba(8,16,8,0.95) 100%); border: 1px solid var(--verde-cana-escuro); border-bottom: 2px solid var(--verde-cana); padding: 0 clamp(10px, 2vw, 25px); clip-path: polygon(0 0, 100% 0, calc(100% - 15px) 100%, 15px 100%); z-index: 12; gap: 10px; }
    .hud-top-left, .hud-top-right { display: flex; align-items: center; gap: clamp(6px, 1vw, 12px); font-size: clamp(0.7rem, 1vw, 0.85rem); font-weight: bold; letter-spacing: 1.5px; white-space: nowrap; }
    .hud-status-dot { width: 9px; height: 9px; background: var(--verde-bright); border-radius: 50%; box-shadow: 0 0 10px var(--verde-bright); animation: pulseDot 1.5s infinite alternate; flex-shrink: 0; }
    @keyframes pulseDot { 0% { opacity: 0.4; } 100% { opacity: 1; transform: scale(1.25); } }
    .hud-text-bright { color: #fff; text-shadow: 0 0 8px var(--verde-glow); }
    .hud-text-dim { color: var(--verde-cana); opacity: 0.8; font-size: 0.75em; }
    .hud-top-center { background: var(--verde-cana); color: #050805; font-weight: 900; padding: 4px clamp(10px, 2vw, 25px); font-size: clamp(0.7rem, 1.1vw, 0.9rem); letter-spacing: 2px; clip-path: polygon(12px 0, calc(100% - 12px) 0, 100% 100%, 0 100%); box-shadow: 0 0 15px var(--verde-glow); white-space: nowrap; text-align: center; }
    .hud-spectrum-bars { display: flex; align-items: flex-end; gap: 3px; height: 14px; }
    .spectrum-bar { width: 3px; background: var(--verde-bright); border-radius: 1px; box-shadow: 0 0 5px var(--verde-bright); animation: spectrumPulse 1.2s ease-in-out infinite alternate; }
    .spectrum-bar:nth-child(1) { height: 40%; animation-delay: 0.1s; }
    .spectrum-bar:nth-child(2) { height: 80%; animation-delay: 0.3s; }
    .spectrum-bar:nth-child(3) { height: 100%; animation-delay: 0.5s; }
    .spectrum-bar:nth-child(4) { height: 60%; animation-delay: 0.2s; }
    .spectrum-bar:nth-child(5) { height: 90%; animation-delay: 0.4s; }
    @keyframes spectrumPulse { 0% { transform: scaleY(0.25); } 100% { transform: scaleY(1); } }

    /* Estilo para os Botões de Canto */
    .btn-fullscreen-top {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--verde-cana);
      color: var(--verde-bright);
      border-radius: 4px;
      padding: 2px 8px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: bold;
      letter-spacing: 1px;
      margin-right: 10px;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }
    .btn-fullscreen-top:hover {
      background: var(--verde-cana);
      color: #000;
      box-shadow: 0 0 10px var(--verde-glow);
    }
    .absolute-top-right {
      position: absolute;
      top: 15px;
      right: 15px;
      margin-right: 0;
    }
    .absolute-top-left {
      position: absolute;
      top: 15px;
      left: 15px;
      margin-right: 0;
    }

    .mobile-tab-nav { display: none; width: 100%; margin: 8px 0 2px 0; gap: 10px; z-index: 15; }
    .mobile-tab-btn { flex: 1; padding: 8px 12px; background: rgba(12, 22, 11, 0.9); border: 1px solid var(--verde-cana-escuro); color: var(--verde-cana); font-weight: 800; font-size: 0.75rem; letter-spacing: 1.5px; text-transform: uppercase; clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); cursor: pointer; transition: all 0.25s ease; }
    .mobile-tab-btn.ativo { background: var(--verde-cana); color: #050805; border-color: #fff; box-shadow: 0 0 15px var(--verde-glow); }

    .dashboard-grid-container { width: 100%; max-width: 1800px; flex: 1; display: grid; grid-template-columns: minmax(320px, 420px) 1fr minmax(320px, 420px); gap: clamp(10px, 1.8vw, 22px); align-items: center; padding: 8px 0; z-index: 10; height: calc(100vh - 110px); min-height: 0; position: relative; }

    .coluna-botoes { display: flex; flex-direction: column; justify-content: center; gap: clamp(30px, 5vh, 48px); height: 100%; max-height: 100%; overflow-y: auto; padding: 0; z-index: 3; }
    .coluna-botoes::-webkit-scrollbar { width: 4px; }
    .coluna-botoes::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
    .coluna-botoes::-webkit-scrollbar-thumb { background: var(--verde-cana-escuro); border-radius: 2px; }

    .app-btn { background: linear-gradient(90deg, rgba(12, 22, 11, 0.95) 0%, rgba(24, 44, 22, 0.9) 100%); border: 1px solid rgba(124, 219, 20, 0.4); border-left: 4px solid var(--verde-cana); color: #fff; padding: clamp(10px, 1.4vh, 14px) clamp(10px, 1vw, 16px); font-size: var(--btn-font-size); font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; cursor: pointer; transition: all 0.25s ease; display: flex; justify-content: space-between; align-items: center; user-select: none; min-height: 44px; width: 95%; max-width: 380px; clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px); }
    .app-btn.left-side-btn { margin-right: auto; }
    .app-btn.right-side-btn { margin-left: auto; }
    .app-btn:hover, .app-btn:focus-visible { background: linear-gradient(90deg, rgba(40, 80, 15, 0.95) 0%, rgba(124, 219, 20, 0.3) 100%); border-color: var(--verde-bright); border-left-color: #fff; transform: translateY(-2px); box-shadow: 0 0 20px var(--verde-glow); }
    .app-btn.ativo { background: linear-gradient(90deg, rgba(124, 219, 20, 0.45) 0%, rgba(35, 70, 15, 0.95) 100%); border-color: #fff; border-left: 5px solid #fff; box-shadow: 0 0 28px var(--verde-glow-strong); color: #fff; font-weight: 800; }

    .btn-badge-idx { font-size: 0.65rem; font-weight: 900; color: var(--verde-cana); background: rgba(0,0,0,0.7); padding: 2px 6px; border-radius: 3px; border: 1px solid rgba(124, 219, 20, 0.3); flex-shrink: 0; margin-right: 8px; }
    .btn-title-text { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; text-shadow: 0 0 4px rgba(162, 248, 60, 0.9), 0 0 10px rgba(124, 219, 20, 0.6); }
    .btn-sci-bracket { font-size: 0.65rem; color: var(--verde-cana); opacity: 0.75; flex-shrink: 0; margin-left: 6px; }
    .app-btn.ativo .btn-badge-idx { background: #fff; color: #050805; }
    .app-btn.ativo .btn-sci-bracket { color: #fff; opacity: 1; text-shadow: 0 0 5px #fff; }

    .center-monitor-wrapper { position: relative; width: 80%; height: 80%; margin: auto; display: flex; justify-content: center; align-items: center; min-height: 0; z-index: 3; }
    .hud-callout-left, .hud-callout-right { position: absolute; top: 50%; transform: translateY(-50%); width: clamp(25px, 3vw, 45px); height: 80%; pointer-events: none; z-index: 5; }
    .hud-callout-left { left: -25px; }
    .hud-callout-right { right: -25px; transform: translateY(-50%) scaleX(-1); }
    .hud-callout-left svg, .hud-callout-right svg { width: 100%; height: 100%; }

    .monitor-corner-bracket { position: absolute; width: clamp(24px, 3vw, 36px); height: clamp(24px, 3vw, 36px); pointer-events: none; z-index: 12; }
    .monitor-corner-bracket svg { width: 100%; height: 100%; }
    .monitor-corner-bracket.tl { top: -4px; left: -4px; }
    .monitor-corner-bracket.tr { top: -4px; right: -4px; transform: scaleX(-1); }
    .monitor-corner-bracket.bl { bottom: -4px; left: -4px; transform: scaleY(-1); }
    .monitor-corner-bracket.br { bottom: -4px; right: -4px; transform: scale(-1, -1); }

    .monitor-gigante { width: 100%; height: 100%; position: relative; background: radial-gradient(circle at 50% 50%, #081207 0%, #030603 85%, #000 100%); border: 3px solid var(--verde-cana); box-shadow: 0 0 45px rgba(76, 138, 8, 0.5), inset 0 0 35px rgba(76, 138, 8, 0.35); clip-path: polygon(25px 0, calc(100% - 25px) 0, 100% 25px, 100% calc(100% - 25px), calc(100% - 25px) 100%, 25px 100%, 0 calc(100% - 25px), 0 25px); display: flex; justify-content: center; align-items: center; overflow: hidden; }
    .monitor-gigante::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: clamp(120px, 20vw, 220px); height: 10px; background: var(--verde-cana); clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 100%, 12px 100%); z-index: 8; }
    .monitor-gigante::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: clamp(120px, 20vw, 220px); height: 10px; background: var(--verde-cana); clip-path: polygon(12px 0, calc(100% - 12px) 0, 100% 100%, 0 100%); z-index: 8; }

    #placeholder-texto { display: flex; flex-direction: column; align-items: center; justify-content: center; position: absolute; pointer-events: none; text-align: center; z-index: 5; padding: 20px; width: 100%; }
    .hud-radar-wrapper { position: absolute; width: clamp(180px, 35vw, 400px); height: clamp(180px, 35vw, 400px); display: flex; justify-content: center; align-items: center; pointer-events: none; }
    .hud-radar-rings { position: absolute; width: 90%; height: 90%; border-radius: 50%; border: 1px dashed rgba(124, 219, 20, 0.35); animation: rotateRadar 25s linear infinite; }
    .hud-radar-rings::before { content: ''; position: absolute; inset: 15%; border-radius: 50%; border: 2px stroke var(--verde-bright); border-style: dotted; opacity: 0.45; animation: rotateRadar 15s linear infinite reverse; }
    @keyframes rotateRadar { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .hud-crosshair-svg { position: absolute; width: 100%; height: 100%; opacity: 0.65; }

    .placeholder-logo { width: clamp(150px, 25vw, 300px); max-width: 85%; filter: drop-shadow(0 0 25px rgba(124, 219, 20, 0.65)); position: relative; z-index: 6; }
    .placeholder-status-badge { display: flex; align-items: center; gap: 8px; margin-top: clamp(12px, 2vh, 22px); background: rgba(6, 14, 5, 0.92); border: 1px solid var(--verde-cana); color: var(--verde-bright); padding: 6px clamp(12px, 2vw, 22px); border-radius: 20px; font-size: clamp(0.65rem, 1vw, 0.8rem); font-weight: 800; letter-spacing: 2px; box-shadow: 0 0 20px rgba(124, 219, 20, 0.35); position: relative; z-index: 6; }

    #app-iframe { width: 100%; height: 100%; border: none; background: transparent; display: none; z-index: 10; }

    .hud-bottom-bar { width: 100%; max-width: 1800px; min-height: var(--hud-bar-height); display: flex; justify-content: space-between; align-items: center; background: linear-gradient(90deg, rgba(8,16,8,0.95) 0%, rgba(18,36,16,0.98) 50%, rgba(8,16,8,0.95) 100%); border: 1px solid var(--verde-cana-escuro); border-top: 2px solid var(--verde-cana); padding: 0 clamp(10px, 2vw, 25px); clip-path: polygon(15px 0, calc(100% - 15px) 0, 100% 100%, 0 100%); z-index: 12; gap: 10px; }
    .hud-info-left, .hud-info-right { display: flex; gap: clamp(6px, 1vw, 12px); }
    .hud-chip { background: rgba(0,0,0,0.65); border: 1px solid rgba(124, 219, 20, 0.35); color: var(--verde-cana); padding: 4px clamp(6px, 1vw, 12px); font-size: clamp(0.65rem, 0.8vw, 0.75rem); font-weight: 700; letter-spacing: 1px; border-radius: 3px; white-space: nowrap; }
    .btn-voltar-cyber { background: linear-gradient(90deg, #180808 0%, #360f0f 50%, #180808 100%); border: 1px solid #ff4444; color: #ff8888; padding: 6px clamp(12px, 2vw, 28px); cursor: pointer; font-weight: 800; font-size: clamp(0.7rem, 0.9vw, 0.8rem); letter-spacing: 2px; text-transform: uppercase; transition: all 0.25s; clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 100%, 0 100%); white-space: nowrap; }
    .btn-voltar-cyber:hover, .btn-voltar-cyber:active { background: #ff4444; color: #fff; box-shadow: 0 0 22px rgba(255, 68, 68, 0.85); }
    .iframe-action-btn { position: absolute; top: 15px; right: 15px; z-index: 15; background: rgba(5, 12, 4, 0.88); border: 1px solid var(--verde-cana); color: var(--verde-bright); padding: 6px 12px; font-size: 0.7rem; font-weight: bold; letter-spacing: 1px; border-radius: 4px; cursor: pointer; display: none; gap: 6px; align-items: center; backdrop-filter: blur(4px); }
    .iframe-action-btn:hover { background: var(--verde-cana); color: #000; }

    /* Piscar do botao de tela cheia quando o navegador derrubou o modo ao abrir a janela */
    .btn-fullscreen-top.precisa-fullscreen {
      background: var(--verde-cana); color: #050805;
      animation: piscarFullscreen 1s infinite alternate;
    }
    @keyframes piscarFullscreen {
      0%   { box-shadow: 0 0 0 rgba(162, 248, 60, 0); }
      100% { box-shadow: 0 0 18px var(--verde-glow-strong); }
    }

    /* ---- BOTAO PLANILHAS + MENU SUSPENSO ---- */
    /* Agrupa o chip "MODULOS OPERACIONAIS" e o botao lado a lado, no centro da barra */
    .hud-center-group { display: flex; align-items: center; gap: 8px; }

    .btn-planilhas {
      background: linear-gradient(90deg, rgba(12, 22, 11, 0.95) 0%, rgba(24, 44, 22, 0.9) 100%);
      border: 1px solid var(--verde-cana);
      color: var(--verde-bright);
      font-family: inherit;
      font-weight: 800;
      font-size: clamp(0.6rem, 0.9vw, 0.78rem);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 5px clamp(8px, 1.2vw, 14px);
      cursor: pointer;
      white-space: nowrap;
      display: flex; align-items: center; gap: 6px;
      clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
      transition: all 0.25s ease;
    }
    .btn-planilhas:hover { background: var(--verde-cana); color: #050805; box-shadow: 0 0 15px var(--verde-glow); }
    .btn-planilhas.aberto { background: var(--verde-cana); color: #050805; box-shadow: 0 0 18px var(--verde-glow-strong); }
    .btn-planilhas .seta { font-size: 0.6rem; transition: transform 0.25s ease; }
    .btn-planilhas.aberto .seta { transform: rotate(180deg); }

    /* O menu vive fora da barra (position: fixed) para nao ser cortado pelo clip-path da HUD */
    #menu-planilhas {
      position: fixed;
      display: none;
      flex-direction: column;
      min-width: 260px;
      max-width: 92vw;
      max-height: 60vh;
      overflow-y: auto;
      background: rgba(6, 14, 5, 0.97);
      border: 1px solid var(--verde-cana);
      border-top: 2px solid var(--verde-bright);
      box-shadow: 0 0 28px rgba(124, 219, 20, 0.35), inset 0 0 25px rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(6px);
      z-index: 9999;
      padding: 6px;
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
    }
    #menu-planilhas.aberto { display: flex; animation: menuDescer 0.2s ease; }
    @keyframes menuDescer { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
    #menu-planilhas::-webkit-scrollbar { width: 4px; }
    #menu-planilhas::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
    #menu-planilhas::-webkit-scrollbar-thumb { background: var(--verde-cana-escuro); border-radius: 2px; }

    .menu-titulo { font-size: 0.6rem; letter-spacing: 2px; color: var(--verde-cana); opacity: 0.7; padding: 4px 10px 8px; border-bottom: 1px solid rgba(124, 219, 20, 0.2); margin-bottom: 4px; text-transform: uppercase; }

    .item-planilha {
      background: transparent; border: none; border-left: 3px solid transparent; color: #fff;
      font-family: inherit; text-align: left; padding: 9px 10px; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
      display: flex; align-items: center; gap: 8px; transition: all 0.18s ease;
    }
    .item-planilha:hover { background: rgba(124, 219, 20, 0.18); border-left-color: var(--verde-bright); padding-left: 14px; }
    .item-planilha .idx { font-size: 0.6rem; font-weight: 900; color: var(--verde-cana); background: rgba(0,0,0,0.7); border: 1px solid rgba(124, 219, 20, 0.3); padding: 2px 5px; border-radius: 3px; flex-shrink: 0; }
    .item-planilha .txt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item-planilha .ext { font-size: 0.6rem; color: var(--verde-cana); opacity: 0.7; flex-shrink: 0; }

    .menu-vazio { padding: 16px 12px; text-align: center; color: var(--verde-cana); font-size: 0.7rem; letter-spacing: 1px; line-height: 1.7; opacity: 0.85; }
    .menu-vazio code { color: var(--verde-bright); background: rgba(0,0,0,0.6); padding: 1px 5px; border-radius: 3px; font-size: 0.68rem; }

    /* ---- REGRAS RESPONSIVAS ---- */
    @media (min-width: 1920px) {
      :root { --hud-bar-height: 54px; --btn-font-size: 0.75rem; }
      .dashboard-grid-container { grid-template-columns: 450px 1fr 450px; gap: 30px; }
      .app-btn { padding: 16px 20px; min-height: 52px; }
      .placeholder-logo { width: 340px; }
    }
    @media (max-height: 720px) and (min-width: 768px) {
      #tela-painel { padding: 6px 15px; }
      .dashboard-grid-container { height: calc(100vh - 100px); grid-template-columns: minmax(300px, 350px) 1fr minmax(300px, 350px); }
      .app-btn { padding: 8px 12px; min-height: 38px; }
      .coluna-botoes { gap: clamp(15px, 3vh, 30px); }
    }
    @media (max-width: 1024px) and (min-width: 768px) {
      .dashboard-grid-container { grid-template-columns: 280px 1fr 280px; gap: 12px; }
      .hud-callout-left, .hud-callout-right { display: none; }
      .hud-chip:nth-child(2), .btn-sci-bracket { display: none; }
      /* Abre espaco na barra superior para o botao PLANILHAS caber no tablet */
      .hud-top-left { min-width: 0; flex-shrink: 1; }
      .hud-top-left .hud-text-bright { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
      .hud-top-left .hud-text-dim, .hud-spectrum-bars { display: none; }
      .hud-top-right .hud-text-dim { display: none; }
      .hud-center-group { min-width: 0; }
      .hud-top-center { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    }
    @media (max-width: 767px) {
      .bg-corner { width: 200px; height: 140px; opacity: 0.5; }
      .bg-center-top, .bg-center-bottom { width: 240px; }
      .laser-horizon-top { top: 40px; } .laser-horizon-bottom { bottom: 40px; }
      #tela-painel { padding: 6px 8px; }
      .hud-top-bar { padding: 0 10px; clip-path: none; }
      .hud-top-left .hud-text-dim, .hud-spectrum-bars { display: none; }
      .hud-top-center { font-size: 0.7rem; padding: 3px 8px; clip-path: none; }
      /* No celular a barra e estreita: o chip encolhe com reticencias e o botao fica compacto */
      .hud-top-bar { overflow: hidden; }
      .hud-center-group { gap: 5px; min-width: 0; flex: 1; justify-content: center; }
      .hud-top-center { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
      .btn-planilhas { padding: 3px 7px; font-size: 0.6rem; letter-spacing: 1px; clip-path: none; flex-shrink: 0; }
      #menu-planilhas { min-width: 0; width: calc(100vw - 20px); }
      /* Sem isto a barra transborda no celular e o botao de tela cheia cobre o PLANILHAS */
      .hud-top-left { min-width: 0; flex-shrink: 1; }
      .hud-top-left .hud-text-bright { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
      .hud-top-right { flex-shrink: 0; }
      .hud-top-right .hud-text-dim { display: none; } /* esconde o rotulo SYS.TIME:, mantem o relogio */
      .mobile-tab-nav { display: flex; }
      .dashboard-grid-container { display: flex; flex-direction: column; height: calc(100vh - 145px); gap: 10px; }
      .mobile-view-modules .center-monitor-wrapper { display: none; }
      .mobile-view-modules .coluna-botoes { display: flex; width: 100%; }
      .mobile-view-monitor .coluna-botoes { display: none; }
      .mobile-view-monitor .center-monitor-wrapper { display: flex; height: 100%; width: 100%; margin: 0; }
      .coluna-botoes { max-height: none; overflow: visible; width: 100%; gap: 8px; }
      
      .app-btn { width: 100%; max-width: none; padding: 12px 14px; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
      .btn-title-text { font-size: 0.75rem; }
      .btn-sci-bracket { display: none; }
      
      .hud-callout-left, .hud-callout-right { display: none; }
      .hud-bottom-bar { padding: 0 10px; clip-path: none; }
      .hud-info-left, .hud-info-right { display: none; }
      .btn-voltar-cyber { width: 100%; text-align: center; clip-path: none; }
      #connection-lines-svg { display: none; }
    }
    @media (max-width: 479px) {
      /* Telas muito estreitas: mostra so o icone do botao, sem a palavra PLANILHAS */
      .btn-planilhas .rotulo { display: none; }
      /* Mantem apenas o LED aceso a esquerda, liberando espaco para o chip e o botao */
      .hud-top-left .hud-text-bright { display: none; }
    }
  </style>
</head>

    let appAtualIndex = -1;

    function atualizarRelogio() {
      const now = new Date();
      const clockEl = document.getElementById('hud-clock');
      if (clockEl) clockEl.innerText = now.toLocaleTimeString('pt-BR');
    }

    function atualizarResoluçãoChip() {
      const chip = document.getElementById('hud-resolution-chip');
      if (chip) {
        const w = window.innerWidth;
        const h = window.innerHeight;
        let mode = 'DESKTOP';
        if (w >= 1920) mode = 'TV / 4K';
        else if (w < 768) mode = 'MOBILE';
        else if (w <= 1024) mode = 'TABLET';
        chip.innerText = `${mode} (${w}x${h})`;
      }
    }

    function drawConnectionLines() {
      const svg = document.getElementById('connection-lines-svg');
      if (window.innerWidth < 768) {
        svg.innerHTML = '';
        return;
      }
      
      const svgRect = svg.getBoundingClientRect();
      const monitorElement = document.querySelector('.monitor-gigante');
      
      if (!monitorElement) return;

      const monitorRect = monitorElement.getBoundingClientRect();
      const monitorCenterY = monitorRect.top + monitorRect.height / 2 - svgRect.top;
      
      const monitorLeftEdge = monitorRect.left - svgRect.left;
      const monitorRightEdge = monitorRect.right - svgRect.left;

      let linesHTML = '';
      const colorStroke = '#7cdb14';
      const colorGlow = '#a2f83c';

      const botoes = document.querySelectorAll('.app-btn');
      botoes.forEach((btn, i) => {
        const bRect = btn.getBoundingClientRect();
        const startY = bRect.top + bRect.height / 2 - svgRect.top;
        
        if (i < 6) {
          const startX = bRect.right - svgRect.left - 2;
          const turnDist = 2.5 - Math.abs(i - 2.5);
          const turnX = monitorLeftEdge - 55 - (turnDist * 12);
          const entryY = monitorCenterY + (i - 2.5) * 10;
          linesHTML += `<path d="M${startX},${startY} L${turnX},${startY} L${turnX},${entryY} L${monitorLeftEdge},${entryY}" stroke="${colorStroke}" stroke-width="1.5" fill="none" opacity="0.85" filter="drop-shadow(0 0 3px ${colorGlow})"/>`;
        } else {
          const startX = bRect.left - svgRect.left + 2; 
          const j = i - 6; 
          const turnDist = 2.5 - Math.abs(j - 2.5);
          const turnX = monitorRightEdge + 55 + (turnDist * 12);
          const entryY = monitorCenterY + (j - 2.5) * 10;
          linesHTML += `<path d="M${startX},${startY} L${turnX},${startY} L${turnX},${entryY} L${monitorRightEdge},${entryY}" stroke="${colorStroke}" stroke-width="1.5" fill="none" opacity="0.85" filter="drop-shadow(0 0 3px ${colorGlow})"/>`;
        }
      });
      
      svg.innerHTML = linesHTML;
    }

    window.addEventListener('resize', () => {
      atualizarResoluçãoChip();
      drawConnectionLines();
    });

    window.onload = () => {
      atualizarRelogio();
      setInterval(atualizarRelogio, 1000);
      atualizarResoluçãoChip();

      const colEsq = document.getElementById('coluna-esquerda');
      const colDir = document.getElementById('coluna-direita');

      colEsq.innerHTML = '';
      colDir.innerHTML = '';

      listaApps.forEach((app, index) => {
        const btn = document.createElement('button');
        btn.id = `btn-app-${index}`;
        const padIdx = (index + 1).toString().padStart(2, '0');
        
        btn.innerHTML = `
          <span class="btn-badge-idx">${padIdx}</span>
          <span class="btn-title-text">${app.nome}</span>
          <span class="btn-sci-bracket">&lt; RUN &gt;</span>
        `;
        
        btn.onclick = () => acionarApp(index);
        
        if (index < 6) {
          btn.className = 'app-btn left-side-btn';
          colEsq.appendChild(btn);
        } else {
          btn.className = 'app-btn right-side-btn';
          colDir.appendChild(btn);
        }
      });

      colEsq.addEventListener('scroll', drawConnectionLines);
      colDir.addEventListener('scroll', drawConnectionLines);
    };

    /* ---- FUNÇÃO DE INICIAR MÚSICA ---- */
    function toggleMusic(e) {
      e.stopPropagation(); // Evita que clique inicie o sistema sem querer
      const music = document.getElementById('bg-music');
      const btn = document.getElementById('btn-music');
      
      if (music.paused) {
        music.play();
        btn.innerText = '[ 🔈 PAUSAR MÚSICA ]';
      } else {
        music.pause();
        btn.innerText = '[ 🎵 INICIAR MÚSICA ]';
      }
    }

    function abrirPainel() {
      tocarBeep();
      document.getElementById('tela-inicial').style.display = 'none';
      document.getElementById('tela-painel').style.display = 'flex';
      document.querySelector('.bg-elements').style.opacity = '0.08';
      
      // Pausa a música ao entrar no Command Center
      const music = document.getElementById('bg-music');
      const btnMusic = document.getElementById('btn-music');
      if (!music.paused) {
        music.pause();
        btnMusic.innerText = '[ 🎵 INICIAR MÚSICA ]';
      }

      drawConnectionLines();
      setTimeout(drawConnectionLines, 650);
    }

    function voltarInicio() {
      tocarBeep();
      document.getElementById('tela-painel').style.display = 'none';
      document.getElementById('tela-inicial').style.display = 'flex';
      document.querySelector('.bg-elements').style.opacity = '0.9';
      
      const iframe = document.getElementById('app-iframe');
      iframe.src = "";
      iframe.style.display = 'none';
      
      document.getElementById('iframe-action-btn').style.display = 'none';
      document.getElementById('placeholder-texto').style.display = 'flex';
      
      removerAtivos();
      appAtualIndex = -1;
    }

    function acionarApp(index) {
      tocarBeep();
      const appSelecionado = listaApps[index];
      const iframe = document.getElementById('app-iframe');
      const iframeActionBtn = document.getElementById('iframe-action-btn');
      
      if (appAtualIndex === index) {
        // Segundo clique no modulo ja ativo: abre em janela separada
        abrirEmNovaJanela(appSelecionado.url, 'modulo_' + index);
        return;
      }

      appAtualIndex = index;
      removerAtivos();
      
      const activeBtn = document.getElementById(`btn-app-${index}`);
      if (activeBtn) activeBtn.classList.add('ativo');

      document.getElementById('placeholder-texto').style.display = 'none';
      iframe.style.display = 'block';
      iframeActionBtn.style.display = 'flex';
      
      if (appSelecionado.url.startsWith('file://')) {
        iframe.style.display = 'none';
        document.getElementById('placeholder-texto').style.display = 'flex';
        document.getElementById('placeholder-texto').innerHTML = `
          <img src="https://static.wixstatic.com/media/9ebff8_5d10d8c7991649848ad5bcc5dc1664cf~mv2.png" alt="Logo Rodopar" class="placeholder-logo" style="margin-bottom:15px; width:220px;">
          <span style="font-size:1.1rem; color:#fff; font-weight:bold; letter-spacing:2px;">ARQUIVO LOCAL DETECTADO</span>
          <span style="font-size:0.8rem; color:var(--verde-bright); margin-top:8px; letter-spacing:1px;">Clique no botão abaixo ou no módulo para abrir em nova janela</span>
        `;
      } else {
        iframe.src = appSelecionado.url;
      }

      if (window.innerWidth < 768) {
        alternarTabMobile('monitor');
      }
    }

    /* =========================================================
       ABERTURA EM JANELA SEPARADA (preserva a tela cheia do Superapp)
       Abrir uma ABA nova na mesma janela faz o navegador sair da tela cheia.
       Informando largura/altura no terceiro parametro do window.open, o
       navegador abre uma JANELA nova e o Superapp continua em tela cheia atras.
       ========================================================= */

    // Guarda a referencia de cada janela aberta, para reaproveitar em vez de abrir varias
    const janelasAbertas = {};

    function abrirEmNovaJanela(url, nomeJanela) {
      if (!url) return null;

      // O nome da janela nao aceita espacos nem acentos
      const nome = String(nomeJanela || 'rodopar_app').replace(/[^A-Za-z0-9_]/g, '_');

      // Se a janela desse item ja esta aberta, apenas traz para frente
      const jaAberta = janelasAbertas[nome];
      if (jaAberta && !jaAberta.closed) {
        jaAberta.focus();
        return jaAberta;
      }

      // Janela com 85% do tamanho do monitor, centralizada
      const larg = Math.round(screen.availWidth * 0.85);
      const alt  = Math.round(screen.availHeight * 0.85);
      const esq  = Math.round((screen.availWidth - larg) / 2);
      const topo = Math.round((screen.availHeight - alt) / 2);

      const opcoes = 'popup=yes,width=' + larg + ',height=' + alt +
                     ',left=' + esq + ',top=' + topo +
                     ',menubar=no,toolbar=no,status=no,resizable=yes,scrollbars=yes';

      // Anota se estavamos em tela cheia ANTES de abrir, para conferir depois
      const estavaEmTelaCheia = !!document.fullscreenElement;

      const janela = window.open(url, nome, opcoes);

      if (!janela) {
        alert('O navegador bloqueou a nova janela.\n\nLibere pop-ups para este site no icone da barra de endereco e clique novamente.');
        return null;
      }

      janelasAbertas[nome] = janela;
      janela.focus();

      // Se o navegador derrubou a tela cheia, faz o botao piscar para o usuario reativar
      // (o navegador nao permite voltar a tela cheia sem um novo clique da pessoa)
      if (estavaEmTelaCheia) {
        setTimeout(conferirTelaCheia, 1200);
      }
      return janela;
    }

    function conferirTelaCheia() {
      const btns = document.querySelectorAll('.btn-fullscreen-top:not(#btn-music)');
      if (!document.fullscreenElement) {
        btns.forEach(btn => btn.classList.add('precisa-fullscreen'));
      }
    }

    function abrirAbaExterna() {
      if (appAtualIndex >= 0 && appAtualIndex < listaApps.length) {
        abrirEmNovaJanela(listaApps[appAtualIndex].url, 'modulo_' + appAtualIndex);
      }
    }

    function removerAtivos() {
      const botoes = document.querySelectorAll('.app-btn');
      botoes.forEach(btn => btn.classList.remove('ativo'));
    }

    function alternarTabMobile(tab) {
      const grid = document.getElementById('dashboard-grid');
      const btnModules = document.getElementById('tab-btn-modules');
      const btnMonitor = document.getElementById('tab-btn-monitor');

      if (tab === 'modules') {
        grid.classList.remove('mobile-view-monitor');
        grid.classList.add('mobile-view-modules');
        btnModules.classList.add('ativo');
        btnMonitor.classList.remove('ativo');
      } else {
        grid.classList.remove('mobile-view-modules');
        grid.classList.add('mobile-view-monitor');
        btnMonitor.classList.add('ativo');
        btnModules.classList.remove('ativo');
      }
    }

    /* ---- FUNÇÃO DE TELA CHEIA (Atualizada para múltiplos botões) ---- */
    function toggleFullScreen() {
      const btns = document.querySelectorAll('.btn-fullscreen-top:not(#btn-music)');
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.log(`Erro ao tentar modo tela cheia: ${err.message}`);
        });
        btns.forEach(btn => btn.innerText = '[- X -]');
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
          btns.forEach(btn => btn.innerText = '[ ⛶ ]');
        }
      }
    }

    // Monitora a saída nativa de tela cheia (ex: apertando Esc) para resetar todos os ícones
    document.addEventListener('fullscreenchange', () => {
      const btns = document.querySelectorAll('.btn-fullscreen-top:not(#btn-music)');
      if (!document.fullscreenElement) {
        btns.forEach(btn => btn.innerText = '[ ⛶ ]');
      } else {
        // Voltou para tela cheia: para de piscar
        btns.forEach(btn => { btn.innerText = '[- X -]'; btn.classList.remove('precisa-fullscreen'); });
      }
    });

    /* =========================================================
       FUNCOES DO MENU SUSPENSO DE PLANILHAS
       ========================================================= */

    // Monta o conteudo do menu a partir da lista. Roda a cada abertura.
    function montarMenuPlanilhas() {
      const menu = document.getElementById('menu-planilhas');
      if (!menu) return;

      // Nenhuma planilha cadastrada ainda: mostra orientacao em vez de menu vazio
      if (!listaPlanilhas || listaPlanilhas.length === 0) {
        menu.innerHTML = '<div class="menu-vazio">NENHUMA PLANILHA CADASTRADA<br>Adicione os links em <code>listaPlanilhas</code><br>no inicio do script do Index.html</div>';
        return;
      }

      let html = '<div class="menu-titulo">// PLANILHAS DISPONIVEIS</div>';
      listaPlanilhas.forEach((planilha, i) => {
        const numero = (i + 1).toString().padStart(2, '0');
        // textoSeguro evita quebrar o HTML se o nome tiver < ou >
        const textoSeguro = String(planilha.nome || 'SEM NOME')
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        html += '<button class="item-planilha" onclick="abrirPlanilha(' + i + ')">' +
                  '<span class="idx">' + numero + '</span>' +
                  '<span class="txt">' + textoSeguro + '</span>' +
                  '<span class="ext">&#8599;</span>' +
                '</button>';
      });
      menu.innerHTML = html;
    }

    // Calcula onde o menu deve aparecer: logo abaixo do botao, sem sair da tela
    function posicionarMenuPlanilhas() {
      const btn = document.getElementById('btn-planilhas');
      const menu = document.getElementById('menu-planilhas');
      if (!btn || !menu) return;

      const area = btn.getBoundingClientRect();
      menu.style.top = (area.bottom + 8) + 'px';

      const larguraMenu = menu.offsetWidth;
      let posX = area.left;
      const limiteDireita = window.innerWidth - larguraMenu - 10;
      if (posX > limiteDireita) posX = limiteDireita;
      if (posX < 10) posX = 10;
      menu.style.left = posX + 'px';
    }

    // Abre ou fecha o menu
    function alternarMenuPlanilhas(evento) {
      if (evento) evento.stopPropagation(); // impede que o clique feche o menu na hora
      const menu = document.getElementById('menu-planilhas');
      const btn = document.getElementById('btn-planilhas');
      if (!menu || !btn) return;

      if (menu.classList.contains('aberto')) {
        fecharMenuPlanilhas();
        return;
      }

      tocarBeep();
      montarMenuPlanilhas();
      menu.classList.add('aberto');
      btn.classList.add('aberto');
      posicionarMenuPlanilhas();
    }

    function fecharMenuPlanilhas() {
      const menu = document.getElementById('menu-planilhas');
      const btn = document.getElementById('btn-planilhas');
      if (menu) menu.classList.remove('aberto');
      if (btn) btn.classList.remove('aberto');
    }

    // Abre a planilha escolhida em uma JANELA separada (mantem a tela cheia do Superapp)
    function abrirPlanilha(indice) {
      const planilha = listaPlanilhas[indice];
      if (!planilha || !planilha.url) {
        alert('Link nao configurado para esta planilha.');
        return;
      }
      tocarBeep();
      fecharMenuPlanilhas();
      abrirEmNovaJanela(planilha.url, 'planilha_' + indice);
    }

    // Fecha o menu ao clicar em qualquer outro lugar da tela
    document.addEventListener('click', function (evento) {
      const menu = document.getElementById('menu-planilhas');
      const btn = document.getElementById('btn-planilhas');
      if (!menu || !menu.classList.contains('aberto')) return;
      if (menu.contains(evento.target) || (btn && btn.contains(evento.target))) return;
      fecharMenuPlanilhas();
    });

    // Fecha o menu com a tecla Esc
    document.addEventListener('keydown', function (evento) {
      if (evento.key === 'Escape') fecharMenuPlanilhas();
    });

    // Se a janela mudar de tamanho, o menu fecha (evita ficar em posicao errada)
    window.addEventListener('resize', fecharMenuPlanilhas);

    function tocarBeep() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.05);
      } catch(e) {}
    }
  </script>
